<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Get Remember When</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#FAF4E8" />
    <link rel="icon" href="/rememberwhen/img/favicon-32.png?v=teal-tv" type="image/png" sizes="32x32" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --paper: #FAF4E8;
        --ink: #2A2320;
        --muted: #5A4F44;
        --teal: #3E7A6D;
        --teal-deep: #2F6357;
        --orange: #E45F24;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 48px 22px 40px;
        background: var(--paper);
        color: var(--ink);
        font-family: Nunito, system-ui, sans-serif;
      }
      .topline {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 10px;
        background: linear-gradient(90deg, var(--teal), #5E9C8F 42%, #FF9C4A);
      }
      .card {
        width: 100%;
        max-width: 440px;
        margin: 8vh auto 0;
        text-align: center;
      }
      .logo {
        width: 112px;
        height: 112px;
        border-radius: 26px;
        display: block;
        margin: 0 auto 22px;
      }
      h1 {
        margin: 0;
        font-family: Fraunces, Georgia, serif;
        font-weight: 700;
        font-size: clamp(34px, 8.4vw, 48px);
        line-height: 1.05;
        letter-spacing: -0.02em;
      }
      h1 span { color: var(--orange); }
      .lead {
        margin: 18px 0 0;
        font-size: 22px;
        font-weight: 700;
        line-height: 1.35;
        color: var(--ink);
      }
      #sub {
        margin: 14px 0 0;
        font-size: 18px;
        font-weight: 700;
        line-height: 1.4;
        color: var(--muted);
      }
      a.btn {
        display: flex;
        width: 100%;
        align-items: center;
        justify-content: center;
        min-height: 64px;
        margin-top: 28px;
        padding: 16px 22px;
        border-radius: 16px;
        background: var(--teal-deep);
        color: var(--paper);
        font-size: 22px;
        font-weight: 800;
        text-decoration: none;
      }
      a.btn:active { background: var(--teal); }
      a.btn:focus-visible {
        outline: 3px solid var(--teal);
        outline-offset: 4px;
      }
      .fine {
        margin: 18px 0 0;
        font-size: 18px;
        font-weight: 800;
        color: var(--teal-deep);
      }
    </style>
  </head>
  <body>
    <div class="topline" aria-hidden="true"></div>
    <main class="card">
      <img class="logo" src="../img/app-icon.png" width="112" height="112" alt="" />
      <h1>Remember <span>When</span></h1>
      <p class="lead">A free phone game. Five questions a day about the songs, TV, and movies you grew up with.</p>
      <p id="sub">Taking you to the App Store…</p>
      <a class="btn" id="store" href="#">Open the App Store</a>
      <p class="fine">Always free.</p>
    </main>

    <script src="../config.js"></script>
    <script src="../rw.js"></script>
    <script>
      var store = document.getElementById("store");
      var sub = document.getElementById("sub");
      var platform = RW.platform();
      store.href = RW.storeUrl();
      if (platform === "android") {
        sub.textContent = "Taking you to Google Play…";
        store.textContent = "Open Google Play";
      } else if (platform === "other") {
        sub.textContent = "Open this link on your phone to get the game.";
        store.textContent = "Get Remember When";
      }
      RW.gotoStoreAfterLog();
    </script>
  </body>
</html>
